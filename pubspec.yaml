name: luxihub_handyman
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  supabase_flutter: ^2.12.2
  bloc: ^9.2.0
  dio: ^5.9.2
  equatable: ^2.0.8
  dartz: ^0.10.1
  get_it: ^8.0.2
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  google_maps_flutter_android: ^2.19.0
  google_maps_flutter_platform_interface: ^2.15.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^17.2.3
  package_rename: ^1.10.1
  flutter_launcher_icons: ^0.14.4
  path_provider: ^2.1.6
  share_plus: ^13.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

package_rename_config:
  android:
    app_name: "LuxiHub Handyman" # Display name
    package_name: "com.luxihub.handymanapp"

  ios:
    app_name: "LuxiHub Handyman" # Display name
    bundle_name: "LuxiHub Handyman" # Bundle name
    package_name: "com.luxihub.handymanapp" # Product Bundle Identifier
  # ... other platforms